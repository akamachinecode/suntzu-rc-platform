# pnpm settings. Since pnpm 11 they live here, not in .npmrc.
# Supply-chain protections below are part of the Itaca standard:
# don't relax them without Itaca engineering approval.

# Only install versions published at least 1 day ago (minutes).
# A malicious release is usually detected and pulled within hours.
minimumReleaseAge: 1440

# Refuse a version whose publishing trust (e.g. npm provenance) is weaker
# than earlier versions of the same package — a sign of a hijacked account.
# Only checked for versions published in the last 30 days (minutes), where
# takeovers happen; older versions have already been vetted by the ecosystem.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

# Dependencies of dependencies may not come from git repos or tarball URLs.
blockExoticSubdeps: true

# Install scripts are blocked unless the package is listed below with `true`.
# Packages listed with `false` were reviewed: they work without their script.
strictDepBuilds: true
allowBuilds:
  "@scarf/scarf": false
  esbuild: false
  sharp: false
  unrs-resolver: false

# Pin exact versions when adding dependencies (`pnpm add`).
saveExact: true

# Workspace packages: the apps (web app, API) and the shared packages.
packages:
  - apps/*
  - packages/*

# Security exceptions and accepted deprecation warnings, reviewed by Itaca engineering.
# Each one says why it exists and when to remove it.
overrides:
  # GHSA-q7qp-rjg7-q26m (high, DoS): multer < 2.5.0, pulled in by @nestjs/platform-express 12.2.0.
  # Remove when @nestjs/platform-express >= 12.3.0 (which depends on multer 2.5.0) is installed.
  multer: 2.5.0
  # GHSA-67mh-4wv8-2f99 (moderate, dev server): esbuild < 0.25.0, pulled in by drizzle-kit 0.31 through @esbuild-kit.
  # Same esbuild drizzle-kit already uses. Remove when drizzle-kit drops @esbuild-kit (1.0).
  "@esbuild-kit/core-utils>esbuild": 0.25.12
allowedDeprecatedVersions:
  # drizzle-kit 0.31 still depends on these deprecated loaders. Remove with the esbuild override above.
  "@esbuild-kit/core-utils": "3"
  "@esbuild-kit/esm-loader": "2"
