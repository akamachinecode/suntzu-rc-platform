name: Deploy

# Builds what changed, applies infra/ with Terraform and publishes the new version. Merging to main
# deploys production; other stages are deployed from the Actions tab. See docs/DEPLOY.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage (needs infra/<stage>.tfvars.json and a GitHub environment with the same name)
        type: choice
        options: [production, staging]
        default: production

permissions:
  contents: read
  id-token: write # OIDC: short-lived AWS credentials, no access keys stored in GitHub

concurrency:
  group: deploy-${{ inputs.stage || 'production' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  STAGE: ${{ inputs.stage || 'production' }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.stage || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.stage || 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Public values for the app image: the hostnames, and two optional settings in Parameter Store
      # (empty until set, docs/DEPLOY.md). The Google button shows once google-client-id exists.
      - name: Read the stage's public settings
        id: settings
        run: |
          echo "app=$(jq -r .hosts.app "infra/$STAGE.tfvars.json")" >> "$GITHUB_OUTPUT"
          echo "api=$(jq -r .hosts.api "infra/$STAGE.tfvars.json")" >> "$GITHUB_OUTPUT"
          turnstile=$(aws ssm get-parameter --name "/rc-landing/$STAGE/turnstile-site-key" --query Parameter.Value --output text 2> /dev/null || true)
          echo "turnstile=$turnstile" >> "$GITHUB_OUTPUT"
          if aws ssm get-parameter --name "/rc-landing/$STAGE/google-client-id" > /dev/null 2>&1; then
            echo "google=true" >> "$GITHUB_OUTPUT"
          else
            echo "google=false" >> "$GITHUB_OUTPUT"
          fi

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Re-running a deploy reuses the images it already pushed (tags can't be overwritten).
      - name: Check which images already exist
        id: built
        run: |
          for image in app api; do
            if aws ecr describe-images --repository-name "rc-landing-$image" --image-ids imageTag="$STAGE-$GITHUB_SHA" > /dev/null 2>&1; then
              echo "$image=true" >> "$GITHUB_OUTPUT"
            fi
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the app image
        if: steps.built.outputs.app != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/rc-landing-app:${{ env.STAGE }}-${{ github.sha }}
          # Public (browser) values are baked in at build time, so each stage gets its own image.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ steps.settings.outputs.app }}
            NEXT_PUBLIC_API_URL=https://${{ steps.settings.outputs.api }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.settings.outputs.turnstile }}
            NEXT_PUBLIC_GOOGLE_SIGN_IN=${{ steps.settings.outputs.google }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build the API image
        if: steps.built.outputs.api != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/rc-landing-api:${{ env.STAGE }}-${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Apply the infrastructure
        working-directory: infra
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_IN_AUTOMATION: "1"
          TF_VAR_image_tag: ${{ env.STAGE }}-${{ github.sha }}
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform init -input=false -backend-config="bucket=rc-landing-tfstate-${account}"
          terraform workspace select -or-create "$STAGE"
          terraform plan -input=false -var-file="$STAGE.tfvars.json" -out=tfplan
          { echo '### Infrastructure changes'; echo '```'; terraform show -no-color tfplan | tail -n 300; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          terraform apply -input=false tfplan

      - name: Check the new version is running
        run: |
          cluster=$(terraform -chdir=infra output -raw cluster)
          terraform -chdir=infra output -json services | jq -r 'to_entries[] | "\(.key) \(.value)"' |
            while read -r service expected; do
              running=$(aws ecs describe-services --cluster "$cluster" --services "$service" \
                --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
              if [ "$running" != "$expected" ]; then
                echo "::error::$service never passed its health check, so ECS rolled back to the previous version. Logs: CloudWatch group /ecs/rc-landing-$STAGE/$service."
                exit 1
              fi
            done
