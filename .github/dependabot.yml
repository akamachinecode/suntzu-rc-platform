version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Supply-chain protection: don't propose versions younger than 7 days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories: [/infra, /infra/bootstrap]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
